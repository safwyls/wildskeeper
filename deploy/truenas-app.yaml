# Wildskeeper on TrueNAS SCALE (24.10+ / Electric Eel and later)
#
# Install as: Apps → Discover → ⋮ → Install via YAML, name it "wildskeeper",
# and paste this file. TrueNAS custom apps are plain Docker Compose, so
# everything in docker-compose.yml applies — this variant just bakes in the
# TrueNAS conventions (host-path dataset, the shared external network, the
# published image instead of a local build).
#
# Before installing:
#
# 1. Make a dataset for the app's state, e.g. /mnt/tank/apps/wildskeeper,
#    and chown it to whatever user the container runs as. The user: line
#    below defaults to TrueNAS's conventional apps user (568:568):
#        chown -R 568:568 /mnt/tank/apps/wildskeeper
#    Any other uid:gid works too — the binary only needs a writable /data —
#    just keep user: and the chown in agreement. (The image's baked-in
#    default is 1000:1000 if you remove the user: line.)
#    Then set the dataset path in the volumes: section below.
#
# 2. Create the shared network the game-server stacks join
#    (docs/sidecar-agent.md "Deployment rule: separate stacks" — the
#    console and each game server are separate apps so tearing one down
#    can never take the other with it):
#        docker network create wildskeeper-net
#
# 3. Fill in the x-secrets values below. The lengths are enforced at
#    startup — wrong lengths make the container exit immediately with a
#    fatal log line. Generate them with:
#        openssl rand -hex 32        # JWT_SECRET      (64 chars; needs ≥32)
#        openssl rand -hex 16        # ENCRYPTION_KEY  (32 chars; needs exactly 32)
#    ENCRYPTION_KEY protects the agent/RCON credentials at rest in the DB —
#    losing it means re-entering every server's tokens.

x-secrets: &secrets
  JWT_SECRET: "CHANGE-ME-openssl-rand-hex-32"
  ENCRYPTION_KEY: "CHANGE-ME-must-be-exactly-32b"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "CHANGE-ME"

services:
  wildskeeper:
    image: ghcr.io/safwyls/wildskeeper:latest
    # TrueNAS's compose backend defaults to pull_policy "missing": once the
    # tag exists locally, redeploys silently reuse the stale image. "always"
    # re-resolves :latest against ghcr on every app update/redeploy.
    pull_policy: always
    # Runs as the TrueNAS apps user; must match the dataset chown (step 1).
    user: "568:568"
    restart: unless-stopped
    ports:
      - "8080:8080"        # web UI + API; put TrueNAS's nginx or Traefik in front if you want TLS
    volumes:
      - /mnt/tank/apps/wildskeeper:/data   # ← your dataset (owned by uid 1000)
    environment:
      <<: *secrets
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      # Power control (start/stop/restart buttons) for game servers that
      # run as containers on this box WITHOUT a wkagent sidecar. Servers
      # fronted by a wkagent don't need this — power goes through the
      # agent — so if every server has an agent you can drop this line
      # and the docker-proxy service entirely.
      DOCKER_HOST: tcp://docker-proxy:2375
      # One-click provisioning from the "Raise a server" wizard. Uncomment
      # both lines (and the wkprovisioner service below) to enable; leave
      # commented to use the copy-paste flow instead — on TrueNAS the paste
      # flow is actually the nicer fit, since one-click containers appear
      # as "discovered" containers rather than as TrueNAS apps.
      # PROVISIONER_URL: http://wkprovisioner:8811
      # PROVISIONER_TOKEN: "CHANGE-ME-same-token-as-wkprovisioner"
      #
      # Ilmari migration (docs/migration.md in the ilmari repo): setting
      # ILMARI_URL routes provisioning through the shared host service
      # instead, and wins over PROVISIONER_URL. Leave the PROVISIONER_*
      # lines in place during the migration — the rollback is deleting
      # these two lines and redeploying. The token is wildskeeper's OWN
      # ilmari client token, not the provisioner's and not palcon's.
      # ILMARI_URL: http://192.168.1.CHANGE-ME:8820
      # ILMARI_TOKEN: "CHANGE-ME-wildskeeper-ilmari-token"
    networks:
      - default
      - wildskeeper-net

  # Scoped docker socket proxy: Wildskeeper never touches the socket
  # directly (root-equivalent). This grants exactly container inspect +
  # start/stop/restart — a compromised console can at worst bounce a game
  # server. Remove if every game server is agent-managed (see above).
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"   # inspect container state
      POST: "1"         # allow start/stop/restart
      # Everything else (IMAGES, VOLUMES, NETWORKS, EXEC, swarm) stays off.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # OPTIONAL one-click provisioner (docs/sidecar-agent.md, phase 5). The
  # one deliberately privileged piece: it holds the real docker socket and
  # runs as root so it can create per-server containers and chown their
  # data dirs. It can only instantiate the locked Dragonwilds template —
  # no arbitrary images/mounts are expressible. Uncomment together with
  # the PROVISIONER_* lines above.
  #
  # wkprovisioner:
  #   image: ghcr.io/safwyls/wkagent:latest
  #   user: "0:0"
  #   restart: unless-stopped
  #   environment:
  #     WKAGENT_MODE: provisioner
  #     WKAGENT_TOKEN: "CHANGE-ME-same-token-as-PROVISIONER_TOKEN"
  #     WKAGENT_DATA_ROOT: /mnt/tank/apps/dragonwilds-servers
  #     WKAGENT_PUBLIC_HOST: 10.0.0.5        # LAN IP players/dashboard reach this box on
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     # MUST be the identical path inside and out: the provisioner mkdirs
  #     # here and hands docker the same string as a host bind.
  #     - /mnt/tank/apps/dragonwilds-servers:/mnt/tank/apps/dragonwilds-servers

networks:
  wildskeeper-net:
    external: true
